<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Developer Finder</title>
    <link rel="stylesheet" href="apistyle.css" />
  </head>

  <body>
    <div class="dev-container">
      <h1 class="dev-title">Developer Finder</h1>
      <p class="dev-subtitle">Find developers for your project.</p>

      <div class="dev-search">
        <input type="text" id="nameInput" placeholder="Enter GitHub username" />
        <button onclick="getProjects()">Search</button>
      </div>

      <a href="saved.html" class="saved-button">View Saved Developers</a>

      <div id="result" class="dev-result"></div>
    </div>

    <script src="apiscript.js"></script>
  </body>
</html>

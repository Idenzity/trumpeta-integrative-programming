<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Saved Projects</title>
    <link rel="stylesheet" href="apistyle.css" />
  </head>

  <body>
    <div class="project-container">
      <h1 class="project-title">Saved Projects</h1>

      <button onclick="goBack()" class="back-btn">← Back to Projects</button>

      <div id="savedList"></div>
    </div>

    <script>
      function goBack() {
        window.location.href = "api-page.html";
      }

      function loadSaved() {
        const saved = JSON.parse(localStorage.getItem("projectData")) || [];
        const container = document.getElementById("savedList");

        if (saved.length === 0) {
          container.innerHTML = "<p>No saved projects yet.</p>";
          return;
        }

        container.innerHTML = saved
          .map(
            (item) => `
              <div class="project-result">
                <h2>${item.name}</h2>
                <p><strong>Developer:</strong> ${item.username}</p>
                <p>${item.description}</p>
                <p>Language: ${item.language}</p>
                <button class="delete-btn" onclick="deleteItem('${item.name}', '${item.username}')">Delete</button>
              </div>
            `,
          )
          .join("");
      }

      function deleteItem(name, username) {
        let saved = JSON.parse(localStorage.getItem("projectData")) || [];

        saved = saved.filter(
          (item) => !(item.name === name && item.username === username),
        );

        localStorage.setItem("projectData", JSON.stringify(saved));

        loadSaved();
      }

      loadSaved();
    </script>
  </body>
</html>

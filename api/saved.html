<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Saved Developers</title>
    <link rel="stylesheet" href="apistyle.css" />
  </head>

  <body>
    <div class="weather-container">
      <h1 class="weather-title">Saved Developers</h1>

      <button onclick="goBack()" class="back-btn">← Back</button>

      <div id="savedList"></div>
    </div>

    <script>
      function goBack() {
        window.location.href = "api-page.html";
      }

      function loadSaved() {
        const saved = JSON.parse(localStorage.getItem("developerData")) || [];
        const container = document.getElementById("savedList");

        if (saved.length === 0) {
          container.innerHTML = "<p>No saved developers yet.</p>";
          return;
        }

        container.innerHTML = saved
          .map(
            (dev) => `
              <div class="weather-result">
                <img src="${dev.avatar}" width="80" style="border-radius:50%; margin-bottom:10px;" />
                <h2>${dev.username}</h2>
                <p>Projects: ${dev.repoCount}</p>
                <a href="${dev.profile}" target="_blank">View Profile</a>
                <br/><br/>
                <button class="delete-btn" onclick="deleteDeveloper('${dev.username}')">Delete</button>
              </div>
            `,
          )
          .join("");
      }

      function deleteDeveloper(username) {
        let saved = JSON.parse(localStorage.getItem("developerData")) || [];

        saved = saved.filter((dev) => dev.username !== username);

        localStorage.setItem("developerData", JSON.stringify(saved));

        loadSaved();
      }

      loadSaved();
    </script>
  </body>
</html>

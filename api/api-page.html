<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project Explorer</title>
    <link rel="stylesheet" href="apistyle.css" />
  </head>

  <body>
    <div class="weather-container">
      <h1 class="weather-title">Project Explorer</h1>
      <p class="weather-subtitle">
        Enter a developer or team name to explore projects
      </p>

      <div class="weather-search">
        <input type="text" id="cityInput" placeholder="Enter GitHub username" />
        <button onclick="getProjects()">Search</button>
      </div>

      <a href="saved.html" class="saved-button">View Saved Projects</a>

      <div id="result" class="weather-result"></div>
    </div>

    <script src="apiscript.js"></script>
  </body>
</html>
